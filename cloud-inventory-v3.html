<!DOCTYPE html>
<html lang="tr" data-theme="xdark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCI Cloud Inventory – örnek (sahte veri)</title>
<script>try{var _t=localStorage.getItem('ci-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);var _l=localStorage.getItem('ci-lang');if(_l)document.documentElement.lang=_l}catch(e){}</script>
<style>
:root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark;
 --bg:#030405;--panel:#090b0e;--panel2:#0e1115;--line:#181c22;--line2:#242a33;--text:#dde2e9;--muted:#7a8494;--shadow:rgba(0,0,0,.6);
 --aws:#ff9900;--azure:#4da3ff;--gcp:#3ddc97;--bad:#ff6b6b;--warn:#f2c14e;--up:#3ddc97;--down:#ff8a5d;
 --d1:#a78bfa;--d2:#f472b6;--d3:#22d3ee;--d4:#f87171;--d5:#facc15;--d6:#a3e635;--d7:#d4a373;--d0:#4b5563;
 --k1:#7c9cff;--k2:#2dd4bf;--k3:#fbbf24;--k4:#e879f9;--k5:#fb7185;--k6:#94a3b8}
:root[data-theme="dark"]{--bg:#15181d;--panel:#1c2027;--panel2:#252a33;--line:#2c323c;--line2:#3b4351;--text:#e6e9ee;--muted:#9aa3b2;--shadow:rgba(0,0,0,.45);--d0:#5b6472}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f5f7;--panel:#ffffff;--panel2:#eef1f4;--line:#e2e5ea;--line2:#cfd5dd;--text:#161b22;--muted:#5d6876;--shadow:rgba(20,30,50,.14);
 --aws:#d97706;--azure:#1d6fd6;--gcp:#0e9a62;--bad:#d23b3b;--warn:#9a6a00;--up:#0e9a62;--down:#d9481c;
 --d1:#7c3aed;--d2:#db2777;--d3:#0891b2;--d4:#dc2626;--d5:#ca8a04;--d6:#65a30d;--d7:#a16207;--d0:#9ca3af;
 --k1:#4f6bed;--k2:#0d9488;--k3:#d97706;--k4:#c026d3;--k5:#e11d48;--k6:#64748b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 10px 18px;margin:0 2px 10px;border-bottom:1px solid var(--line)}
.brand img{width:128px;height:128px;border-radius:50%;display:block;box-shadow:0 0 0 1px color-mix(in srgb,var(--azure) 25%,transparent),0 10px 34px color-mix(in srgb,var(--azure) 18%,transparent)}
.brand span{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.node{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:none;color:var(--muted);text-align:left;cursor:pointer}
.node:hover{background:var(--panel2);color:var(--text)}
.node.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--c,var(--text))}
.node .n{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.node.root{font-weight:600;margin-top:4px}
.node.soon{opacity:.45;cursor:default}
.node.dep{margin-top:4px;border-top:1px dashed var(--line);border-radius:0 0 6px 6px;padding-top:9px}
.ic{flex:none;vertical-align:-4px}
h1 .ic{vertical-align:-6px;margin-right:4px}
.ci{flex:none;opacity:.85}
.node:hover .ci,.node.active .ci{opacity:1;color:var(--c,var(--text))}
tr.grp .ci{vertical-align:-3px;margin-right:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
.kids{margin:2px 0 6px 14px;padding-left:8px;border-left:1px solid var(--line)}
.sep{height:1px;background:var(--line);margin:12px 8px}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:220px;max-width:560px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
input.q{width:100%;padding:10px 12px 10px 36px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--text);font:inherit}
.btn{padding:8px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.demo{margin-left:auto;font-size:12px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:3px 10px;border-radius:99px;white-space:nowrap}
.scan{color:var(--muted);font-size:12.5px;white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.seg button{display:flex;align-items:center;justify-content:center;min-width:32px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:650;letter-spacing:.02em}
.seg button:hover{color:var(--text);background:var(--panel2)}
.seg button[aria-pressed="true"]{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.content{padding:26px 28px 60px;max-width:1500px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
h2{font-size:15px;margin:28px 0 10px}
.h2row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 10px}
.h2row h2{margin:0;display:flex;align-items:center;gap:8px}
.h2row .h2n{color:var(--muted);font-size:12.5px}
.h2row .h2n b{color:var(--text)}
.h2row .link{margin-left:auto;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card .h{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:6px}
.card .big{font-size:28px;font-weight:650;letter-spacing:-.02em}
.card .meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.up{color:var(--up)}.down{color:var(--down)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel)}
th.num .sortbtn{flex-direction:row-reverse}
td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
tfoot td{border-top:1px solid var(--line2);border-bottom:0;font-weight:650;background:var(--panel2)}
tr.grp td{background:var(--panel2);color:var(--muted);font-weight:600;padding:8px 14px}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);color:var(--muted)}
.b-ok{color:var(--up);border-color:color-mix(in srgb,var(--up) 32%,transparent);background:color-mix(in srgb,var(--up) 9%,transparent)}
.b-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.b-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.dtag{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:99px;font-size:12px;border:1px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--text)}
.cellbtn{display:flex;justify-content:space-between;gap:16px;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.cellbtn:hover .nat{color:var(--text)}
.cellbtn .nat,.pend .nat{color:var(--muted)}
.cellbtn b,.pend b{font-variant-numeric:tabular-nums}
.numbtn{padding:0;border:0;background:none;cursor:pointer;color:var(--text);font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--muted)}
.numbtn:hover{color:var(--azure);border-bottom-color:var(--azure)}
.pend{display:flex;justify-content:space-between;gap:16px;opacity:.75;cursor:help}
.pend b{border-bottom:1px dashed var(--muted)}
.link{background:none;border:0;padding:0;color:var(--azure);cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit}
label.chk{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:var(--text);border-color:var(--c,var(--text));background:color-mix(in srgb,var(--c,#888) 9%,var(--panel))}
.tab.on{color:var(--text);border-color:var(--c,var(--text));background:color-mix(in srgb,var(--c,#888) 16%,var(--panel));font-weight:600}
.tab .n{font:12px var(--mono);padding:0 7px;border-radius:99px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);font-weight:400}
.tab.on .n,.tab:hover .n{color:var(--c,var(--text));border-color:color-mix(in srgb,var(--c,#888) 45%,var(--line2))}
.sortbtn{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.sortbtn:hover{color:var(--text)}
.sortbtn .arr{font-size:10px;opacity:.35}
.sortbtn.on{color:var(--text)}
.sortbtn.on .arr{opacity:1;color:var(--azure)}
.native{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:3px 11px;border:1px solid var(--line2);border-radius:99px;background:var(--panel);color:var(--text);cursor:pointer;font:12.5px var(--mono)}
.chip:hover{background:var(--panel2)}
.more{margin:14px 0 0;text-align:center}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px}
svg.chart{width:100%;height:auto;display:block}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line2);padding:12px 16px;border-radius:10px;max-width:340px;z-index:20;box-shadow:0 8px 30px var(--shadow)}
/* dağılım */
.dist{display:grid;grid-template-columns:minmax(270px,310px) minmax(0,1fr);gap:12px}
.dist .card{display:flex;flex-direction:column}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:12px}
.mini{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 12px}
.mini .t{display:flex;align-items:center;gap:7px;font-weight:600;margin-bottom:6px}
.mini .t .ci{color:var(--muted)}
.lg{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.lg b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lg .v{font-variant-numeric:tabular-nums;text-align:right}
.big-lg{font-size:13.5px;gap:8px 12px;margin-top:14px}
svg.donut{flex:none;display:block}
svg.donut circle.seg{transition:stroke-width .15s}
svg.donut circle.seg:hover{stroke-width:var(--hw)}
.dblock{display:grid;grid-template-columns:minmax(230px,270px) minmax(0,1fr);gap:12px}
.dcard{display:flex;align-items:center;justify-content:center;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 16px;box-shadow:inset 3px 0 0 var(--c);color:var(--text);font:inherit}
button.tile{cursor:pointer;transition:border-color .15s,background .15s}
button.tile:hover{border-color:var(--c);background:var(--panel2)}
.tl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;min-width:0}
.tl .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ci{opacity:1;color:var(--c)}
.tv{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.tp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;border-radius:2px;background:var(--c)}
@media (max-width:1240px){.scan{display:none}}
@media (max-width:1180px){
 .dist,.dblock{grid-template-columns:1fr}
 .tiles{--cols:3!important}
}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .cards.c3,.minis{grid-template-columns:1fr}
 .tiles{--cols:2!important}
 .brand{flex-direction:row;justify-content:flex-start}
 .brand img{width:52px;height:52px}
 aside{position:static;height:auto;max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}
 .top{padding:10px 16px}
 .content{padding:18px 16px 50px}
 .demo{display:none}
}
@media print{
 :root,:root[data-theme]{--bg:#fff;--panel:#fff;--panel2:#f3f3f3;--line:#ccc;--line2:#bbb;--text:#000;--muted:#444}
 aside,.top,.bar,.tabs,.more,.toast,.sortbtn .arr{display:none}
 .app{display:block}
}
</style>
</head>

function sk(v){
 if(v==null||v===''||v==='—')return null;
 if(typeof v==='number')return v;
 const s=String(v).trim();let m;
 if(m=s.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)(\/\d+)?$/))return ((+m[1]*256+ +m[2])*256+ +m[3])*256+ +m[4];
 if(m=s.match(/^([\d.]+)\s*(MB|GB|TB)$/))return parseFloat(m[1])*({MB:1/1024,GB:1,TB:1024}[m[2]]);
 if(s==='today')return 0;
 if(m=s.match(/^(\d+) days ago$/))return +m[1];
 if(/^-?\d+(\.\d+)?$/.test(s))return +s;
 return s;
}
function sortRows(arr,tbl,getters){
 const st=S.sort;if(st.tbl!==tbl||st.col<0||!getters[st.col])return arr;
 const g=getters[st.col],d=st.dir;
 return arr.map((r,i)=>[r,sk(g(r)),i]).sort((a,b)=>{const x=a[1],y=b[1];
  if(x==null&&y==null)return a[2]-b[2];if(x==null)return 1;if(y==null)return -1;
  const c=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),LANG,{numeric:true,sensitivity:'base'});
  return c*d||a[2]-b[2]}).map(a=>a[0]);
}

 s+=`<circle cx="${m}" cy="${m}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${th}"/>`;
 if(tot)for(const p of parts){const len=p.v/tot*C;if(len>0){const Lg=Math.max(len-gap,.5);
  s+=`<circle class="seg" cx="${m}" cy="${m}" r="${r}" fill="none" style="stroke:${p.c}" stroke-width="${th}" stroke-dasharray="${Lg} ${C-Lg}" stroke-dashoffset="${-off}" transform="rotate(-90 ${m} ${m})"><title>${esc(p.name)}: ${fmt(p.v)} (${pc(p.v,tot,1)})</title></circle>`}
  off+=len}

 const T=TKEY[S.type],cn=CATS.find(x=>x[0]===S.cat)[1];
 const types=TYPES.filter(x=>x.cat===S.cat);
 const cols=[];for(const cl of T.cols){cols.push(cl);if(cl[0]==='@acct')cols.push(D)}
 let h=`<h1>${icon(k,28)} ${c.label} · ${cn}</h1><p class="sub">${esc(T.label)}<span class="native">${esc(T.nat[ci])}</span></p>`;
 h+=`<div class="tabs" role="tablist">`+types.map(x=>`<button class="tab${x.key===S.type?' on':''}" style="--c:${c.color}" role="tab" data-nav="cat:${k}:${S.cat}:${x.key}:${esc(S.acct)}:${esc(S.dept)}">${esc(x.label)}<span class="n">${fmt(COUNT[k][S.cat+'/'+x.key]||0)}</span></button>`).join('')+`</div>`;
 const base=ROWS.filter(r=>r.cloud===k&&r.type===S.type);
 const regs=[...new Set(base.map(r=>r.region))].sort();
 h+=`<div class="bar"><select id="fAcct" aria-label="${unitTxt(k,'U_')}"><option value="">${unitTxt(k,'A_')}</option>${c.accounts.map(a=>`<option value="${esc(a.id)}"${S.acct===a.id?' selected':''}>${esc(a.name)}</option>`).join('')}</select>
 <select id="fReg" aria-label="Region"><option value="">${t('allRegions')}</option>${regs.map(r=>`<option${S.region===r?' selected':''}>${esc(r)}</option>`).join('')}</select>
 <select id="fDept" aria-label="${t('department')}"><option value="">${t('allDepts')}</option>${DEPTS.map(d=>`<option${S.dept===d?' selected':''}>${esc(d)}</option>`).join('')}<option value="-"${S.dept==='-'?' selected':''}>${t('untagged')}</option></select>
 <label class="chk"><input type="checkbox" id="fFlag"${S.flagged?' checked':''}> ${t('flagged')}</label></div>`;
 let rows=base.filter(r=>(!S.acct||r.accId===S.acct)&&(!S.region||r.region===S.region)&&(!S.dept||(S.dept==='-'?!r.dept:r.dept===S.dept))&&(!S.flagged||r.flag));
 const CG=cols.map(([f])=>f==='@acct'?r=>r.accName:f==='@region'?r=>r.region:f==='@flag'?r=>r.flag||null:f==='@dept'?r=>r.dept||null:r=>r[f]);
 rows=sortRows(rows,'res',CG);
 const shown=rows.slice(0,S.limit);
 h+=`<div class="wrap"><table><thead><tr>${cols.map((cl,i)=>th('res',i,esc(cl[1]))).join('')}</tr></thead><tbody>`;
 h+=shown.length?shown.map(r=>`<tr>${cols.map(cl=>`<td>${cell(r,cl)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="dim" style="padding:28px;text-align:center">${t('noRows')}</td></tr>`;
 h+=`</tbody></table></div><p class="note">${t('rowsN',fmt(rows.length),rows.length>shown.length?fmt(shown.length):0)}</p>`;
 if(rows.length>shown.length)h+=`<div class="more"><button class="btn" id="more">${t('more')}</button></div>`;
 return h;
}
function chart(k){
 const W=420,H=240,Lf=48,Rr=14,Tp=16,B=30,MO=t('months');
 const v0=HIST[k],lo=Math.min(...v0),hi=Math.max(...v0);
 const step=hi>1000?100:hi>300?20:10;
 const min=Math.floor(lo/step)*step-step,max=Math.ceil(hi/step)*step+step;
 const x=i=>Lf+i*(W-Lf-Rr)/9,y=v=>Tp+(1-(v-min)/(max-min))*(H-Tp-B);
 const col=CV[k];
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartA',label(k))}">`;
 for(let g=0;g<=3;g++){const v=min+(max-min)*g/3;s+=`<line x1="${Lf}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${Lf-8}" y="${y(v)+4}" text-anchor="end" style="fill:var(--muted)" font-size="10.5">${fmt(Math.round(v))}</text>`}
 MO.forEach((m,i)=>{if(i%2===1||i===9)s+=`<text x="${x(i)}" y="${H-9}" text-anchor="middle" style="fill:var(--muted)" font-size="10.5">${m}${i===9?'*':''}</text>`});
 s+=`<polyline fill="none" style="stroke:${col}" stroke-width="2.2" stroke-linejoin="round" points="${v0.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
 v0.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===9?4.2:3}" style="fill:${col}"><title>${label(k)} · ${MO[i]}: ${fmt(v)}</title></circle>`});
 return s+'</svg>';
}
function vHistory(){
 const MO=t('months');
 let h=`<h1>${gi('history',26)} ${t('history')}</h1><p class="sub">${t('histSub')}</p>`;
 h+=`<div class="cards c3">`+CK.map(k=>{const p=pct(HIST[k][9],HIST[k][8]);return `<div class="card"><div class="h">${icon(k,18)}${label(k)}</div><div class="big ${pctCls(p)}">${pctTxt(p)}</div><div class="meta">${t('histMeta',fmt(HIST[k][8]),fmt(HIST[k][9]))}</div></div>`}).join('')+`</div>`;
 h+=`<h2>${t('monthly')}</h2><div class="cards c3">${CK.map(k=>`<div class="chartbox"><div style="display:flex;align-items:center;gap:8px;padding:0 8px 6px;color:var(--muted)">${icon(k,18)}${label(k)}<span style="margin-left:auto;font-size:12px">${t('ownScale')}</span></div>${chart(k)}</div>`).join('')}</div><p class="note">${t('histNote')}</p>`;
 h+=`<h2>${t('monthlyT')}</h2><div class="wrap"><table><thead><tr>${th('hist',0,t('month'))}${CK.map((k,j)=>th('hist',1+j*2,`${icon(k,18)} ${label(k)}`,'num')+th('hist',2+j*2,t('change'),'num')).join('')}</tr></thead><tbody>`;
 const HG=[i=>i,...CK.flatMap(k=>[i=>HIST[k][i],i=>i?pct(HIST[k][i],HIST[k][i-1]):null])];
 for(const i of sortRows([9,8,7,6,5,4,3,2,1,0],'hist',HG)){h+=`<tr><td>${MO[i]} 2026${i===9?'*':''}</td>`+CK.map(k=>{const v=HIST[k][i];if(!i)return `<td class="num">${fmt(v)}</td><td class="num dim">—</td>`;const p=pct(v,HIST[k][i-1]);return `<td class="num">${fmt(v)}</td><td class="num ${pctCls(p)}">${pctTxt(p)}</td>`}).join('')+'</tr>'}
 return h+'</tbody></table></div>';
}
function idxOf(r){return r._s||(r._s=[r.name,r.id,r.privateIp,r.publicIp,r.ip,r.attached,r.cidr].filter(v=>v&&v!=='—').join('\u0001').toLowerCase())}
function vSearch(){
 const q=S.q.toLowerCase();
 let hits=ROWS.filter(r=>idxOf(r).includes(q));
 const FL=['name','id','privateIp','publicIp','ip','attached','cidr'];
 const mf=r=>{const f=FL.find(f=>r[f]&&r[f]!=='—'&&String(r[f]).toLowerCase().includes(q));return f?t('f_'+f):null};
 const ipOf=r=>[r.privateIp,r.publicIp,r.ip].filter(v=>v&&v!=='—').join(' · ');
 hits=sortRows(hits,'search',[r=>label(r.cloud),r=>r.accName,r=>r.region,r=>TKEY[r.type].label,r=>r.name||r.id,r=>ipOf(r)||null,r=>r.dept||null,mf]);
 let h=`<h1>${t('searchT')}: “${esc(S.q)}”</h1><p class="sub">${t('results',fmt(hits.length),hits.length>100)}</p>`;
 h+=`<div class="wrap"><table><thead><tr>${t('sCols').map((l,i)=>th('search',i,l)).join('')}<th></th></tr></thead><tbody>`;
 h+=hits.slice(0,100).map(r=>{
  const T=TKEY[r.type],ci=CK.indexOf(r.cloud);
  return `<tr><td>${icon(r.cloud,18)} ${label(r.cloud)}</td><td>${esc(r.accName)} <span class="mono dim">${esc(r.accId.length>14?r.accId.slice(0,8)+'…':r.accId)}</span></td><td class="mono">${esc(r.region)}</td><td>${esc(T.label)} <span class="dim">${esc(T.nat[ci])}</span></td><td>${esc(r.name||r.id)}${r.name?` <span class="mono dim">${esc(r.id||'')}</span>`:''}</td><td class="mono">${esc(ipOf(r))}</td><td>${dtag(r.dept)}</td><td class="dim">${esc(mf(r)||'')}</td><td><button class="link" data-nav="cat:${r.cloud}:${r.cat}:${r.type}:${esc(r.accId)}">${t('open')}</button></td></tr>`}).join('')||`<tr><td colspan="9" class="dim" style="padding:28px;text-align:center">${t('noMatch')}</td></tr>`;
 return h+'</tbody></table></div>';
}

function render(){
 tree();
 const m=$('main');
 if(S.q.length>=2)m.innerHTML=vSearch();
 else m.innerHTML=S.view==='multi'?vMulti():S.view==='cloud'?vCloud():S.view==='cat'?vCat():S.view==='dept'?vDept():vHistory();
 if(S.q.length<2&&S.view==='multi'&&!S.cat){
  const ex=ROWS.find(r=>r.cloud==='aws'&&r.type==='instances'&&r.state==='running'&&r.publicIp!=='—');
  const ex2=ROWS.find(r=>r.cloud==='azure'&&r.type==='instances');
  const c=document.createElement('div');
  c.innerHTML=`<p class="note" style="margin-top:22px">${t('tryS')}</p><div class="chips">${[ex.privateIp,ex.name,ex2.name,ex.publicIp].map(v=>`<button class="chip" data-q="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  m.appendChild(c);
 }
}

/* ---------- dil ve tema ---------- */
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function chrome(){
 const de=document.documentElement;
 de.lang=LANG;
 $('aside').setAttribute('aria-label',t('nav'));
 $('q').placeholder=t('search');$('q').setAttribute('aria-label',t('searchA'));
 $('scan').textContent=t('scan');$('refresh').textContent=t('refresh');$('pdf').textContent=t('pdf');$('demo').textContent=t('demo');
 $('langSeg').setAttribute('aria-label',t('lang'));$('themeSeg').setAttribute('aria-label',t('theme'));
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
 const th0=de.getAttribute('data-theme')||'xdark';
 document.querySelectorAll('[data-theme-set]').forEach(b=>{const v=b.dataset.themeSet;b.setAttribute('aria-pressed',v===th0);b.title=t(v);b.setAttribute('aria-label',t(v))});
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
 const lg=e.target.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;store('ci-lang',LANG);chrome();render();return}
 const tm=e.target.closest('[data-theme-set]');if(tm){document.documentElement.setAttribute('data-theme',tm.dataset.themeSet);store('ci-theme',tm.dataset.themeSet);chrome();return}
 const so=e.target.closest('[data-sort]');if(so){const [tb,c]=so.dataset.sort.split(':');const st=S.sort;
  if(st.tbl===tb&&st.col===+c)st.dir=-st.dir;else S.sort={tbl:tb,col:+c,dir:1};render();
  const b=document.querySelector(`[data-sort="${so.dataset.sort}"]`);if(b)b.focus({preventScroll:true});return}
 const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}
 const c=e.target.closest('[data-q]');if(c){$('q').value=c.dataset.q;S.q=c.dataset.q;render();return}
 if(e.target.id==='more'){S.limit+=200;render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='fAcct'){S.acct=e.target.value;S.limit=100;render()}
 if(e.target.id==='fReg'){S.region=e.target.value;S.limit=100;render()}
 if(e.target.id==='fDept'){S.dept=e.target.value;S.limit=100;render()}
 if(e.target.id==='fFlag'){S.flagged=e.target.checked;S.limit=100;render()}
});
let tmr;$('q').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{S.q=e.target.value.trim();render()},150)});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();$('q').focus()}
 if(e.key==='Escape'&&S.q){$('q').value='';S.q='';render()}
});
function toast(x){const el=$('toast');el.textContent=x;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
$('refresh').addEventListener('click',()=>toast(t('toast')));
$('pdf').addEventListener('click',()=>window.print());
chrome();
render();
</script>
</body>
</html>
